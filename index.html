<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="monetag" content="b5b294053f189c5c3f743f7a7b177b2f">
    <title>TezTranslate by Javohir</title>
    <!-- Tesseract.js kutubxonasi (rasmdan matn o'qish uchun) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@v5/dist/tesseract.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: #333; }
        label { display: block; margin-top: 10px; margin-bottom: 5px; font-weight: bold; }
        textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 16px;
            box-sizing: border-box;
        }
        textarea { height: 100px; }
        input[type="file"] {
            margin-bottom: 15px;
            width: 100%;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
        }
        button:hover { background-color: #0056b3; }
        .result-box {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            min-height: 50px;
            margin-top: 10px;
            word-break: break-word;
        }
        #status { font-size: 14px; color: #666; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>TezTranslate 🚀</h2>
        
        <!-- Rasm yuklash qismi -->
        <label>Rasm yuklash yoki rasmga olish:</label>
        <input type="file" id="imageInput" accept="image/*">
        <p id="status"></p>

        <!-- 40+ tillar ro'yxati -->
        <label>Qaysi tilga tarjima qilish kerak:</label>
        <select id="targetLanguage">
            <option value="uz">O'zbekcha</option>
            <option value="en">English (Inglizcha)</option>
            <option value="ru">Русский (Ruscha)</option>
            <option value="tr">Türkçe (Turkcha)</option>
            <option value="es">Español (Ispancha)</option>
            <option value="fr">Français (Fransuzcha)</option>
            <option value="de">Deutsch (Nemischa)</option>
            <option value="ar">العربية (Arabcha)</option>
            <option value="zh">中文 (Xitoycha)</option>
            <option value="ja">日本語 (Japancha)</option>
            <option value="ko">한국어 (Koreyscha)</option>
            <option value="fa">فارسی (Forscha)</option>
            <option value="hi">हिन्दी (Hindcha)</option>
            <option value="ur">اردو (Urducha)</option>
            <option value="it">Italiano (Italyancha)</option>
            <option value="pt">Português (Portugalcha)</option>
            <option value="kk">Қазақша ( Qozoqcha)</option>
            <option value="ky">Кыргызча (Qirg'izcha)</option>
            <option value="tg">Тоҷикӣ (Tojikcha)</option>
            <option value="az">Azərbaycan (Ozarbayjoncha)</option>
            <option value="uk">Українська (Ukraincha)</option>
            <option value="pl">Polski (Polyakcha)</option>
            <option value="nl">Nederlands (Gollandcha)</option>
            <option value="el">Ελληνικά (Yunoncha)</option>
            <option value="sv">Svenska (Shvedcha)</option>
            <option value="no">Norsk (Norvegcha)</option>
            <option value="fi">Suomi (Fincha)</option>
            <option value="da">Dansk (Datcha)</option>
            <option value="cs">Čeština (Chexcha)</option>
            <option value="hu">Magyar (Vengercha)</option>
            <option value="ro">Română (Rumincha)</option>
            <option value="bg">Български (Bolgarcha)</option>
            <option value="sr">Српски (Serbcha)</option>
            <option value="hr">Hrvatski (Xorvatcha)</option>
            <option value="sk">Slovenčina (Slovakcha)</option>
            <option value="id">Bahasa Indonesia (Indonezcha)</option>
            <option value="ms">Bahasa Melayu (Malaycha)</option>
            <option value="vi">Tiếng Việt (Vyetnamcha)</option>
            <option value="th">ไทย (Taycha)</option>
            <option value="bn">বাংলা (Bengalcha)</option>
            <option value="he">עברית (Ivrit)</option>
        </select>

        <!-- Matn kiritish qismi -->
        <label>Tarjima qilinadigan matn:</label>
        <textarea id="sourceText" placeholder="Matnni kiriting yoki rasmdan o'qing..."></textarea>
        
        <button onclick="translateText()">Tarjima qilish</button>

        <!-- Natija qismi -->
        <label>Natija:</label>
        <div class="result-box" id="resultText">Tarjima bu yerda chiqadi...</div>

        <!-- Ovoz bilan o'qish tugmasi -->
        <button onclick="speakResult()" style="background-color: #28a745; margin-top: 15px;">🔊 Ovoz chiqarib o'qish</button>
    </div>

    <script>
        // Rasm yuklanganda matnni avtomatik o'qib olish (OCR)
        const imageInput = document.getElementById('imageInput');
        const sourceText = document.getElementById('sourceText');
        const status = document.getElementById('status');

        imageInput.addEventListener('change', (e) => {
