<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TezTranslate by Javohir</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    font-family: -apple-system, Arial, sans-serif;
    background: #f4f6fb;
    color: #222;
  }
  .card {
    background: #fff;
    max-width: 520px;
    margin: 0 auto;
    padding: 22px;
    border-radius: 20px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  }
  h1 { text-align: center; font-size: 24px; margin: 4px 0 20px; }
  label { display: block; font-weight: bold; margin: 14px 0 8px; font-size: 16px; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  select, textarea {
    width: 100%;
    font-size: 17px;
    padding: 12px;
    border: 1.5px solid #ccc;
    border-radius: 12px;
    background: #f1f1f1;
  }
  select { height: 52px; }
  textarea { background: #fff; min-height: 110px; resize: vertical; font-family: inherit; }
  #result {
    min-height: 90px;
    padding: 14px;
    border: 1.5px solid #ccc;
    border-radius: 12px;
    background: #fafafa;
    font-size: 18px;
    white-space: pre-wrap;
  }
  button {
    width: 100%;
    border: 0;
    color: #fff;
    font-size: 19px;
    font-weight: bold;
    padding: 16px;
    border-radius: 14px;
    margin-top: 16px;
  }
  #translateBtn { background: #0057b8; }
  #speakBtn { background: #28a745; }
  button:disabled { opacity: 0.6; }
  #status { margin-top: 8px; font-size: 14px; color: #666; min-height: 18px; }
  .social {
    max-width: 520px;
    margin: 16px auto 8px;
    display: flex;
    gap: 12px;
  }
  .social a {
    flex: 1;
    text-align: center;
    color: #fff;
    text-decoration: none;
    font-weight: bold;
    padding: 14px 10px;
    border-radius: 30px;
    font-size: 17px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.2);
  }
  .insta { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
  .tg { background: #229ed9; }
</style>
</head>
<body>
<div class="card">
  <h1>TezTranslate by Javohir 🚀</h1>

  <label for="imageInput">Rasm yuklash yoki rasmga olish:</label>
  <input type="file" id="imageInput" accept="image/*">

  <div class="row">
    <div>
      <label for="fromLang">Qaysi tildan:</label>
      <select id="fromLang"></select>
    </div>
    <div>
      <label for="toLang">Qaysi tilga:</label>
      <select id="toLang"></select>
    </div>
  </div>

  <label for="inputText">Tarjima qilinadigan matn:</label>
  <textarea id="inputText" placeholder="Matn yozing..."></textarea>

  <button id="translateBtn">Tarjima qilish</button>
  <div id="status"></div>

  <label>Natija:</label>
  <div id="result"></div>

  <button id="speakBtn">🔊 Ovoz chiqarib o'qish</button>
</div>

<div class="social">
  <a class="insta" href="https://instagram.com/jokha.arm" target="_blank" rel="noopener">📷 Instagram</a>
  <a class="tg" href="https://t.me/ii7jb" target="_blank" rel="noopener">✈️ Telegram</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
