<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="monetag" content="b5b294053f189c5c3f743f7a7b177b2f">
    <title>TezTranslate by Javohir</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@v5/dist/tesseract.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            position: relative;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 70px;
            box-sizing: border-box;
        }
        h2 { text-align: center; color: #333; margin-top: 0; }
        label { display: block; margin-top: 10px; margin-bottom: 5px; font-weight: bold; color: #444; }
        textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 15px;
            box-sizing: border-box;
        }
        textarea { height: 90px; }
        .lang-group {
            display: flex;
            gap: 10px;
        }
        .lang-group div { flex: 1; }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 5px;
        }
        button:hover { background-color: #0056b3; }
        .result-box {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            min-height: 45px;
            margin-top: 5px;
            word-break: break-word;
            font-size: 16px;
        }
        .phonetic-box {
            font-style: italic;
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }
        #status { font-size: 14px; color: #007bff; text-align: center; margin-bottom: 10px; }
        
        .instagram-link {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>TezTranslate by Javohir 🚀</h2>
        
        <label>Rasm yuklash yoki rasmga olish:</label>
        <input type="file" id="imageInput" accept="image/*">
        <p id="status"></p>

        <div class="lang-group">
            <div>
                <label>Qaysi tildan:</label>
                <select id="sourceLanguage">
                    <option value="auto">Avto-aniqlash</option>
                    <option value="uz">O'zbekcha</option>
                    <option value="en">Inglizcha</option>
                    <option value="ru">Ruscha</option>
                    <option value="tr">Turkcha</option>
                    <option value="es">Ispancha</option>
                    <option value="fr">Fransuzcha</option>
                    <option value="de">Nemischa</option>
                    <option value="ar">Arabcha</option>
                    <option value="zh">Xitoycha</option>
                    <option value="ja">Japancha</option>
                    <option value="ko">Koreyscha</option>
                    <option value="kk">Qozoqcha</option>
                    <option value="ky">Qirg'izcha</option>
                    <option value="tg">Tojikcha</option>
                    <option value="az">Ozarbayjoncha</option>
                </select>
            </div>
            <div>
                <label>Qaysi tilga:</label>
                <select id="targetLanguage">
                    <option value="en">Inglizcha</option>
                    <option value="uz">O'zbekcha</option>
                    <option value="ru">Ruscha</option>
                    <option value="tr">Turkcha</option>
                    <option value="es">Ispancha</option>
                    <option value="fr">Fransuzcha</option>
                    <option value="de">Nemischa</option>
                    <option value="ar">Arabcha</option>
                    <option value="zh">Xitoycha</option>
                    <option value="ja">Japancha</option>
                    <option value="ko">Koreyscha</option>
                    <option value="kk">Qozoqcha</option>
                    <option value="ky">Qirg'izcha</option>
                    <option value="tg">Tojikcha</option>
                    <option value="az">Ozarbayjoncha</option>
                </select>
            </div>
        </div>

        <label>Tarjima qilinadigan matn:</label>
        <textarea id="sourceText" placeholder="Matn kiriting yoki rasm yuklang..."></textarea>
        
        <button onclick="translateText()">Tarjima qilish</button>

        <label>Natija:</label>
        <div class="result-box" id="resultText">Tarjima bu yerda chiqadi...</div>
        <div class="phonetic-box" id="phoneticText"></div>

        <button onclick="speakResult()" style="background-color: #28a745; margin-top: 12px;">🔊 Ovoz chiqarib o'qish</button>
    </div>

    <a href="https://instagram.com/jokha.arm" target="_blank" class="instagram-link">
        <i class="fa-brands fa-instagram"></i> @jokha.arm
    </a>

    <script>
        const imageInput = document.getElementById('imageInput');
        const sourceText = document.getElementById('sourceText');
        const status = document.getElementById('status');

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            status.innerText = "Rasm o'qilmoqda, kuting...";
            sourceText.value = "";

            Tesseract.recognize(
                file,
                'eng+uzb+rus', 
                { 
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            status.innerText = `O'qilmoqda: ${Math.round(m.progress * 100)}%`;
                        }
                    }
                }
            ).then(({ data: { text } }) => {
                status.innerText = "Muvaffaqiyatli o'qildi!";
                sourceText.value = text.trim();
            }).catch(err => {
                status.innerText = "Rasmni o'qishda xatolik bo'ldi.";
            });
        });

        async function translateText() {
            let text = sourceText.value.trim();
            let srcLang = document.getElementById('sourceLanguage').value;
            let targetLang = document.getElementById('targetLanguage').value;
            let resultBox = document.getElementById('resultText');
            let phoneticBox = document.getElementById('phoneticText');

            if (!text) {
                alert("Iltimos, matn kiriting yoki rasm yuklang!");
                return;
            }

            resultBox.innerText = "Tarjima qilinmoqda...";
            phoneticBox.innerText = "";

            try {
                let url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${srcLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
                let response = await fetch(url);
                let data = await response.json();

                if (data && data[0]) {
                    let translatedText = "";
                    data[0].forEach(item => {
                        if (item[0]) translatedText += item[0];
                    });
                    
                    resultBox.innerText = translatedText;
                    phoneticBox.innerText = "O'qilishi: " + translatedText;
                    return;
                }
            } catch (error) {
                console.log("1-usul");
            }

            try {
                let langPair = (srcLang === 'auto' ? 'uz' : srcLang) + '|' + targetLang;
                let altUrl = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langPair}`;
                let altResponse = await fetch(altUrl);
                let altData = await altResponse.json();

                if (altData && altData.responseData && altData.responseData.translatedText) {
                    resultBox.innerText = altData.responseData.translatedText;
                    phoneticBox.innerText = "O'qilishi: " + altData.responseData.translatedText;
                } else {
                    resultBox.innerText = "Tarjimada xatolik bo'ldi.";
                }
            } catch (e) {
                resultBox.innerText = "Internetda xatolik yoki tarjima olinmadi.";
            }
        }

        function speakResult() {
            let textToSpeak = document.getElementById('resultText').innerText;
            if (!textToSpeak || textToSpeak === "Tarjima bu yerda chiqadi..." || textToSpeak === "Tarjima qilinmoqda...") {
                alert("O'qish uchun matn mavjud emas!");
                return;
            }
            
            let speech = new SpeechSynthesisUtterance(textToSpeak);
            let targetLang = document.getElementById('targetLanguage').value;
            speech.lang = targetLang === 'uz' ? 'uz-UZ' : (targetLang === 'en' ? 'en-US' : (targetLang === 'ru' ? 'ru-RU' : targetLang));
            window.speechSynthesis.speak(speech);
        }
    </script>
</body>
</html>
