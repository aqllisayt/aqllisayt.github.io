    <!-- Xato to'g'irlandi: "buring" o'rniga "kiriting" yozildi -->
    <textarea id="inputText" placeholder="Matnni kiriting..."></textarea>
    <button onclick="translateText()">Tarjima qilish</button>

    <div class="result-box" id="outputText">Tarjima bu yerda chiqadi...</div>
  </div>

  <script>
    async function translateText() {
      const text = document.getElementById('inputText').value;
      const source = document.getElementById('sourceLang').value;
      const target = document.getElementById('targetLang').value;
      const output = document.getElementById('outputText');

      if (!text.trim()) {
        output.innerText = "Iltimos, matn kiriting!";
        return;
      }

      output.innerText = "Tarjima qilinmoqda...";

      try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${source}&tl=${target}&dt=t&q=${encodeURIComponent(text)}`);
        const data = await res.json();
        
        // Ba'zida tarjima bir nechta qismga bo'linib kelishi mumkin, ularni to'liq birlashtirish:
        let translatedText = "";
        if (data && data[0]) {
          data[0].forEach(item => {
            if (item[0]) translatedText += item[0];
          });
        }
        
        output.innerText = translatedText || "Tarjima topilmadi.";
      } catch (error) {
        output.innerText = "Xatolik yuz berdi. Qayta urinib ko'ring.";
      }
    }
  </script>
